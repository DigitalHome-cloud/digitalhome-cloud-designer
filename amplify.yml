version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm install
        # Set AMPLIFY_BACKEND_APP_ID on this Hosting app to the umbrella's
        # Amplify App ID (d16j3iwmdgx3tq for stage). Amplify Hosting then
        # auto-generates amplify_outputs.json at the project root before
        # this preBuild phase runs. We copy it to src/ where Gatsby's
        # gatsby-browser.js + gatsby-ssr.js expect it.
        - cp amplify_outputs.json src/amplify_outputs.json
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
