version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Standard install
        - node -v
        - npm ci
        - npm list graphql
        # Create Backend configuration
        - echo "App ID variable is $AMPLIFY_BACKEND_APP_ID"
        - echo "App Branch variable is $AMPLIFY_BACKEND_APP_BRANCH"
        - npx ampx generate outputs --branch $AMPLIFY_BACKEND_APP_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID --out-dir ./src
        - ls -la src/amplify_outputs.json
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
