version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm ci
        # Use the variable to pull the outputs from the remote backend
        - npx ampx generate outputs --app-id $AMPLIFY_BACKEND_APP_ID --branch stage
        # Copy to src/ for Gatsby compatibility
        - cp amplify_outputs.json src/amplify_outputs.json
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
